<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Editing Service Form</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        color: #ffffff;
        font-family: "Playfair Display", serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .form-container {
        width: 100%;
        max-width: 1200px;
        padding: 40px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 50px;
        margin-bottom: 30px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-group.full-width {
        grid-column: 1 / -1;
      }

      label {
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 12px;
        color: #ffffff;
      }

      input[type="text"],
      input[type="tel"],
      input[type="email"],
      select {
        background-color: #191919;
        border: 1px solid #333333;
        border-radius: 8px;
        padding: 18px 22px;
        font-size: 16px;
        color: #cccccc;
        font-family: "Playfair Display", serif;
        transition: all 0.3s ease;
        outline: none;
        width: 100%;
      }

      input[type="text"]:focus,
      input[type="tel"]:focus,
      input[type="email"]:focus,
      select:focus {
        border-color: #e59935;
        background-color: #222222;
        color: #ffffff;
      }

      input::placeholder {
        color: #666666;
        font-family: "Playfair Display", serif;
      }

      select {
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23666666' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 12px center;
        background-repeat: no-repeat;
        background-size: 16px;
        padding-right: 40px;
      }

      select option {
        background-color: #1a1a1a;
        color: #ffffff;
      }

      .submit-container {
        display: flex;
        justify-content: center;
        margin-top: 40px;
      }

      .apply-btn {
        background: linear-gradient(135deg, #e59935 0%, #ffe998 100%);
        border: none;
        border-radius: 25px;
        padding: 15px 40px;
        font-size: 18px;
        font-weight: 600;
        color: #000000;
        cursor: pointer;
        font-family: "Playfair Display", serif;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(229, 153, 53, 0.3);
      }

      .apply-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(229, 153, 53, 0.4);
      }

      .apply-btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(229, 153, 53, 0.3);
      }

      @media (max-width: 768px) {
        .form-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .form-container {
          padding: 20px;
        }

        label {
          font-size: 16px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        select {
          padding: 12px 15px;
          font-size: 15px;
        }

        .apply-btn {
          padding: 12px 35px;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <form id="photoEditingForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="firstName">First name</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="Enter your first name"
              required
            />
          </div>

          <div class="form-group">
            <label for="lastName">Last name</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Enter your last name"
              required
            />
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="Enter your number"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="editingInterest">Editing Interest</label>
            <select id="editingInterest" name="editingInterest" required>
              <option value="Portrait">Portrait</option>
              <option value="Wedding">Wedding</option>
              <option value="Product">Product</option>
              <option value="Real Estate">Real Estate</option>
              <option value="Fashion">Fashion</option>
              <option value="Nature">Nature</option>
              <option value="Event">Event</option>
              <option value="Commercial">Commercial</option>
            </select>
          </div>

          <div class="form-group">
            <label for="batchTiming">Preferred Batch Timing</label>
            <select id="batchTiming" name="batchTiming" required>
              <option value="Morning">Morning</option>
              <option value="Afternoon">Afternoon</option>
              <option value="Evening">Evening</option>
              <option value="Night">Night</option>
            </select>
          </div>
        </div>

        <div class="submit-container">
          <button type="submit" class="apply-btn">Apply Now</button>
        </div>
      </form>
    </div>

    <script>
      document
        .getElementById("photoEditingForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Get form data
          const formData = new FormData(this);
          const firstName = formData.get("firstName");
          const lastName = formData.get("lastName");
          const mobile = formData.get("mobile");
          const email = formData.get("email");
          const editingInterest = formData.get("editingInterest");
          const batchTiming = formData.get("batchTiming");

          // Validate all fields are filled
          if (
            !firstName ||
            !lastName ||
            !mobile ||
            !email ||
            !editingInterest ||
            !batchTiming
          ) {
            alert("Please fill in all fields before submitting.");
            return;
          }

          // Create WhatsApp message
          const message =
            `*Photo Editing Service Application*%0A%0A` +
            `*Name:* ${firstName} ${lastName}%0A` +
            `*Mobile:* ${mobile}%0A` +
            `*Email:* ${email}%0A` +
            `*Editing Interest:* ${editingInterest}%0A` +
            `*Preferred Batch Timing:* ${batchTiming}%0A%0A` +
            `Thank you for your interest in our photo editing services!`;

          // WhatsApp number
          const whatsappNumber = "+916295590363";

          // Create WhatsApp URL
          const whatsappURL = `https://wa.me/${whatsappNumber}?text=${message}`;

          // Open WhatsApp
          window.open(whatsappURL, "_blank");
        });
    </script>
  </body>
</html>
