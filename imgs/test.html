<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Section</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Playfair Display", serif;
        margin: 0;
        padding: 20px;
        color: #fff;
      }

      * {
        font-family: "Playfair Display", serif !important;
      }

      ::placeholder {
        font-family: "Playfair Display", serif;
        font-size: 14px;
        color: #999;
      }

      .contact-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }

      .contact-form {
        background: #111;
        padding: 30px 25px;
        border-radius: 12px;
        min-height: 420px;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .form-2 {
        display: flex;
        flex-direction: column; /* stack items vertically */
        gap: 16px; /* adjust the value as needed */
      }

      .contact-form h2 {
        font-size: 26px;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #ffe998 0%, #e59935 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .contact-form h2 span {
        font-style: italic;
      }

      .contact-form p {
        font-size: 14px;
        color: #aaa;
        margin-bottom: 20px;
      }

      .form-row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }

      .form-row input {
        flex: 1;
      }

      .contact-form input {
        width: 100%;
        padding: 12px;
        border: 1px solid #666;
        border-radius: 6px;
        background: rgba(58, 58, 58, 0.5);
        color: #fff;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .contact-form input:focus {
        outline: none;
        border-color: #ffe998;
        background: rgba(58, 58, 58, 0.8);
        box-shadow: 0 0 0 2px rgba(255, 233, 152, 0.2);
      }

      .contact-form button {
        margin-top: 15px;
        padding: 12px 30px;
        border: none;
        border-radius: 20px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(90deg, #e59935, #ffe998, #e59935);
        color: #000;
        font-size: 14px;
        transition: all 0.3s ease;
        align-self: flex-start;
        box-shadow: 0 4px 15px rgba(229, 153, 53, 0.3);
      }

      .contact-form button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(229, 153, 53, 0.4);
      }

      .contact-info {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .contact-info .image {
        width: 100%;
        height: 300px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .contact-info .image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .contact-info .image:hover img {
        transform: scale(1.05);
      }

      .info-boxes {
        display: flex;
        gap: 20px;
      }

      .info-box {
        flex: 1;
        background: #111;
        padding: 15px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .info-box:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        border-color: rgba(255, 233, 152, 0.3);
      }

      .info-box i {
        font-size: 20px;
        color: #ffe998;
        transition: all 0.3s ease;
      }

      .info-box:hover i {
        transform: scale(1.1);
      }

      .info-box div {
        font-size: 13px;
        color: #ccc;
      }

      .info-box div strong {
        display: block;
        color: #fff;
        margin-bottom: 4px;
      }

      .map-container {
        margin-top: 20px;
        width: 100%;
        height: 300px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      .map-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Success message styles */
      .success-message {
        display: none;
        background: rgba(76, 175, 80, 0.1);
        border: 1px solid #4caf50;
        color: #4caf50;
        padding: 12px 16px;
        border-radius: 6px;
        margin-top: 10px;
        font-size: 14px;
        text-align: center;
      }

      .success-message.show {
        display: block;
      }

      @media (max-width: 768px) {
        body {
          padding: 15px;
        }

        .contact-container {
          grid-template-columns: 1fr;
        }

        .contact-form {
          padding: 25px 20px;
        }

        .info-boxes {
          flex-direction: column;
        }

        .contact-info .image {
          height: 220px;
        }

        .map-container {
          height: 250px;
        }
      }

      @media (max-width: 480px) {
        .contact-form h2 {
          font-size: 22px;
        }

        .form-row {
          flex-direction: column;
          gap: 12px;
        }

        .contact-form input {
          padding: 10px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="contact-container">
      <!-- Left: Form -->
      <div class="contact-form">
        <h2>Get in touch <span>with us</span></h2>
        <p>We're here to help with any questions or feedback</p>

        <form id="contactForm">
          <div class="form-row">
            <input
              type="text"
              id="firstName"
              placeholder="First name"
              required
            />
            <input type="text" id="lastName" placeholder="Last name" required />
          </div>
          <div class="form-2">
            <input type="email" id="email" placeholder="Email" required />
            <input
              type="text"
              id="enquiryType"
              placeholder="Enquiry Type"
              required
            />
            <input type="text" id="city" placeholder="City" required />
          </div>
          <button type="submit">Send Message</button>

          <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i> Message sent successfully!
            Redirecting to WhatsApp...
          </div>
        </form>
      </div>

      <!-- Right: Image + Info -->
      <div class="contact-info">
        <div class="image">
          <img
            src="https://img.freepik.com/free-photo/empty-online-radio-studio-broadcasting-room-with-professional-microphone-video-light-used-podcast-transmission-video-podcasting-setup-with-digital-mixer-console-laptop-computer_482257-33423.jpg?semt=ais_hybrid&w=740&q=80"
            alt="Studio"
          />
        </div>
        <div class="info-boxes">
          <div class="info-box" onclick="sendEmail()">
            <i class="fa-solid fa-envelope"></i>
            <div>
              <strong>Email</strong>
              Office : abcdefvc@gmail.com
            </div>
          </div>
          <div class="info-box" onclick="callOffice()">
            <i class="fa-solid fa-phone"></i>
            <div>
              <strong>Phone</strong>
              Office : +91 9051819976
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div class="map-container">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3679.257285261754!2d75.85772591491903!3d22.752937385088365!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x396302b52f307ef7%3A0x61d42e2f1ffba07c!2sAkshay%20Entertainment!5e0!3m2!1sen!2sin!4v1700000000000!5m2!1sen!2sin"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>

    <script>
      // Form submission handler
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Get form data
          const firstName = document.getElementById("firstName").value.trim();
          const lastName = document.getElementById("lastName").value.trim();
          const email = document.getElementById("email").value.trim();
          const enquiryType = document
            .getElementById("enquiryType")
            .value.trim();
          const city = document.getElementById("city").value.trim();

          // Validate required fields
          if (!firstName || !lastName || !email || !enquiryType || !city) {
            alert(
              "Please fill in all required fields (First name, Last name, Email, Enquiry Type, and City)"
            );
            return;
          }

          // Show success message
          const successMessage = document.getElementById("successMessage");
          successMessage.classList.add("show");

          // Create WhatsApp message
          const whatsappMessage = `Hello! I'm reaching out through your website contact form.

*Contact Details:*
Name: ${firstName} ${lastName}
Email: ${email}
Enquiry Type: ${enquiryType}
City: ${city}

I look forward to hearing from you soon!`;

          // Send to WhatsApp after a brief delay
          setTimeout(() => {
            sendToWhatsApp(whatsappMessage);

            // Reset form and hide success message after sending
            setTimeout(() => {
              document.getElementById("contactForm").reset();
              successMessage.classList.remove("show");
            }, 2000);
          }, 1000);
        });

      function sendToWhatsApp(message) {
        // Replace with your actual WhatsApp number (country code + number, no + or spaces)
        const phoneNumber = "919916663357"; // Using the phone number from your contact info
        const encodedMessage = encodeURIComponent(message);
        const whatsappURL = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
        window.open(whatsappURL, "_blank");
      }

      // Email click handler
      function sendEmail() {
        const email = "abcdefvc@gmail.com"; // Replace with actual email
        const subject = "Inquiry from Website";
        const body =
          "Hello,\n\nI'm interested in learning more about your services.\n\nBest regards,";
        const mailtoURL = `mailto:${email}?subject=${encodeURIComponent(
          subject
        )}&body=${encodeURIComponent(body)}`;
        window.open(mailtoURL, "_self");
      }

      // Phone click handler
      function callOffice() {
        window.open("tel:+919916663357", "_self");
      }

      // Add click handler to map for directions
      document
        .querySelector(".map-container")
        .addEventListener("click", function () {
          const mapURL =
            "https://www.google.com/maps/place/Akshay+Entertainment/@22.7529374,75.8577259,15z/data=!4m5!3m4!1s0x396302b52f307ef7:0x61d42e2f1ffba07c!8m2!3d22.7529374!4d75.8577259";
          window.open(mapURL, "_blank");
        });

      // Add some interactive feedback
      document.querySelectorAll(".contact-form input").forEach((field) => {
        field.addEventListener("focus", function () {
          this.style.transform = "scale(1.02)";
        });

        field.addEventListener("blur", function () {
          this.style.transform = "scale(1)";
        });
      });
    </script>
  </body>
</html>
