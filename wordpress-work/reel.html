<div class="reel-embed" style="--accent: #d7b686">
  <div class="reel-frame">
    <iframe
      title="Reel video"
      src="https://www.youtube-nocookie.com/embed/sOxloXyOAKA?autoplay=1&amp;mute=1&amp;loop=1&amp;controls=0&amp;modestbranding=1&amp;playsinline=1&amp;rel=0&amp;iv_load_policy=3&amp;playlist=sOxloXyOAKA"
      allowfullscreen="allowfullscreen"
    ></iframe>
  </div>
</div>
<style>
    .reel-embed{<br />
      --accent:#D7B686;<br />
      max-width: 360px;      /* adjust or remove for full width */<br />
      margin: 0 auto;<br />
      background: var(--accent);<br />
      padding: 4px;          /* very thin edge */<br />
      border-radius: 8px;    /* subtle rounding */<br />
    }</p>
  <p>  .reel-embed .reel-frame{<br />
      aspect-ratio: 9 / 16;<br />
      position: relative;<br />
      overflow: hidden;<br />
      border-radius: 6px;<br />
      background: #000;<br />
    }</p>
  <p>  .reel-embed iframe{<br />
      position: absolute;<br />
      inset: 0;<br />
      width: 100%;<br />
      height: 100%;<br />
      border: 0;<br />
    }</p>
  <p>  @supports not (aspect-ratio: 9 / 16){<br />
      .reel-embed .reel-frame{ width:100%; }<br />
      .reel-embed .reel-frame::before{<br />
        content:"";<br />
        display:block;<br />
        padding-top:177.78%; /* 9:16 ratio fallback */<br />
      }<br />
      .reel-embed iframe{<br />
        position:absolute; top:0; left:0; width:100%; height:100%;<br />
      }<br />
    }<br />
</style>
